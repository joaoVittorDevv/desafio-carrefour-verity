[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-adk-transpiler"
version = "0.1.0"
description = "Synthetic clinical request pipeline transpiled to Google ADK"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "jinja2>=3.1,<4",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
runtime = ["google-adk>=1,<3", "mcp>=1.24,<2", "pillow>=10,<13", "ruff>=0.15,<0.16"]
ocr = ["mcp>=1.24,<2", "rapidocr-onnxruntime>=1,<2", "opencv-python-headless>=4,<5", "numpy>=1,<3", "presidio-analyzer>=2,<3", "spacy>=3,<4", "uvicorn>=0.30,<1"]
rag = ["mcp>=1.24,<2", "fastembed>=0.5,<1", "psycopg2-binary>=2.9,<3", "numpy>=1,<3", "uvicorn>=0.30,<1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg2-binary>=2.9,<3", "presidio-analyzer>=2,<3", "spacy>=3,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "pytest-asyncio>=0.23,<2", "pillow>=10,<13", "ruff>=0.15,<0.16", "fastapi>=0.115,<1", "mcp>=1.24,<2", "psycopg2-binary>=2.9,<3", "numpy>=1,<3", "google-adk>=1,<3"]

[tool.setuptools.packages.find]
include = ["transpiler*", "runtime*", "security*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = ["mock: no real model, network, or database"]

[tool.coverage.run]
omit = ["runtime/generated/*"]

[tool.ruff]
line-length = 100
