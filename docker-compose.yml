services:
  postgres-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinical}
      POSTGRES_USER: ${POSTGRES_USER:-clinical}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  mcp-ocr:
    build:
      context: .
      dockerfile: services/mcp_ocr/Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./assets:/app/inputs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 12

  mcp-rag:
    build:
      context: .
      dockerfile: services/mcp_rag/Dockerfile
    environment:
      DB_DSN: postgresql://${POSTGRES_USER:-clinical}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres-db:5432/${POSTGRES_DB:-clinical}
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./services/mcp_rag/data:/app/data:ro
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 12

  scheduling-api:
    build:
      context: .
      dockerfile: services/scheduling_api/Dockerfile
    environment:
      DB_DSN: postgresql://${POSTGRES_USER:-clinical}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres-db:5432/${POSTGRES_DB:-clinical}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 12

  agent-cli:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./assets:/app/inputs:ro
      - ./specs:/app/specs:ro
      - ./runtime/generated:/app/runtime/generated:rw
    depends_on:
      mcp-ocr:
        condition: service_healthy
      mcp-rag:
        condition: service_healthy
      scheduling-api:
        condition: service_healthy

volumes:
  pgdata:
